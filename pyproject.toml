[project]
name = "tractor-game"
version = "0.1.0"
description = "tractor card game"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.0",
    "starlette==1.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "psutil>=7.0.0",
    "numpy",
]

[project.optional-dependencies]
training-mps = [
    "torch==2.12.1; sys_platform == 'darwin'",
]
training-cpu = [
    "torch==2.12.1; sys_platform == 'linux'",
]
training-cuda = [
    "torch==2.12.1; sys_platform == 'linux'",
]
dev = [
    "playwright",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.4.0",
    "ruff",
    "basedpyright",
]

[tool.uv]
conflicts = [
    [
        { extra = "training-mps" },
        { extra = "training-cpu" },
        { extra = "training-cuda" },
    ],
]

[[tool.uv.index]]
name = "pytorch-default"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-default", extra = "training-mps" },
    { index = "pytorch-cpu", extra = "training-cpu" },
    { index = "pytorch-default", extra = "training-cuda" },
]

[tool.pytest.ini_options]
testpaths = [
    "server",
    "tests",
]
pythonpath = ["."]
python_files = ["*_tests.py", "test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --timeout=60 --timeout-method=thread"
asyncio_mode = "auto"
markers = [
    "playthrough: visible browser full-game Playwright playthrough",
]

[tool.ruff]
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.basedpyright]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "all"
include = ["scripts", "server", "tests"]
venvPath = "."
venv = ".venv"
